name: PJR three-starter test

on:
  push:
    branches: [pjr-rebuild]
  workflow_dispatch:

permissions:
  contents: write

env:
  UNUSED_ERROR: 0
  DEPRECATED_ERROR: 1

jobs:
  three-starter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staged PJR content patch
        run: |
          git apply pjr-content.patch
          git rm pjr-content.patch
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add include src
          git commit -m "PJR: add catalyst framework, Pinsirex and Eevee access [skip ci]"
          git push origin HEAD:pjr-rebuild
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3
      - name: Install PJR Infinity donor assets
        run: |
          cat \
            assets/pjr_infinity/parts/part00.txt \
            assets/pjr_infinity/parts/part01.txt \
            assets/pjr_infinity/parts/part02.txt \
            assets/pjr_infinity/fixed/part030.txt \
            assets/pjr_infinity/fixed/part031.txt \
            assets/pjr_infinity/fixed/part032.txt \
            assets/pjr_infinity/fixed/part0330.txt \
            assets/pjr_infinity/fixed/part0331.txt \
            assets/pjr_infinity/fixed/part0332.txt \
            assets/pjr_infinity/fixed/part0333.txt \
            assets/pjr_infinity/parts/part04.txt \
            assets/pjr_infinity/parts/part05.txt \
            assets/pjr_infinity/parts/part06.txt \
            | base64 -d > /tmp/pjr-infinity-assets.zip
          python3 - <<'PY'
          import pathlib, shutil, zipfile
          src = pathlib.Path('/tmp/pjr-infinity-assets')
          with zipfile.ZipFile('/tmp/pjr-infinity-assets.zip') as zf:
              zf.extractall(src)
          for species_dir in src.iterdir():
              if not species_dir.is_dir():
                  continue
              dst = pathlib.Path('graphics/pokemon') / species_dir.name
              dst.mkdir(parents=True, exist_ok=True)
              for name in ('front.png', 'back.png', 'icon.png'):
                  # Keep Run44 battle graphics, but use the approved repo icons.
                  if name == 'icon.png' and species_dir.name in ('skarmet', 'mootiny'):
                      continue
                  shutil.copy2(species_dir / name, dst / name)
          PY
      - name: Build PJR three-starter test
        run: |
          make hns -j4 -O
      - name: Package three-starter test
        run: |
          cp pokehns.gba PJR-Run${{ github.run_number }}-Focused-Fixes.gba
          arm-none-eabi-nm -n pokehns.elf > PJR-Run${{ github.run_number }}-Focused-Fixes.sym
      - uses: actions/upload-artifact@v4
        with:
          name: PJR-Run${{ github.run_number }}-Focused-Fixes
          path: |
            PJR-Run${{ github.run_number }}-Focused-Fixes.gba
            PJR-Run${{ github.run_number }}-Focused-Fixes.sym
          if-no-files-found: error
          retention-days: 7
