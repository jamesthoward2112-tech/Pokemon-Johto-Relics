name: PJR Alpha build

on:
  push:
    branches: [pjr-rebuild, pjr-recovery-run182]
  pull_request:
    branches: [pjr-rebuild, pjr-recovery-run182]
  workflow_dispatch:

permissions:
  contents: read

env:
  UNUSED_ERROR: 0
  DEPRECATED_ERROR: 1

jobs:
  three-starter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact Azul Agua donor tiles
        run: |
          base64 -d assets/pjr_azul_agua/building_tiles.png.b64 > data/tilesets/primary/azul_agua_building_hns/tiles.png
          base64 -d assets/pjr_azul_agua/rock_shop_tiles.png.b64 > data/tilesets/secondary/azul_agua_rock_shop_hns/tiles.png
          echo "19d1988dc7426e0be5957918de876e7a500ae327cc99bf53ef55d172d6a0f240  data/tilesets/primary/azul_agua_building_hns/tiles.png" | sha256sum -c -
          echo "5dac0833356b45617e3321e3686a15460a4f88d3f631cd1697071802f21bcc6a  data/tilesets/secondary/azul_agua_rock_shop_hns/tiles.png" | sha256sum -c -
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3 python3-pil git
      - name: Install PJR Infinity donor assets
        run: |
          cat \
            assets/pjr_infinity/parts/part00.txt \
            assets/pjr_infinity/parts/part01.txt \
            assets/pjr_infinity/parts/part02.txt \
            assets/pjr_infinity/fixed/part030.txt \
            assets/pjr_infinity/fixed/part031.txt \
            assets/pjr_infinity/fixed/part032.txt \
            assets/pjr_infinity/fixed/part0330.txt \
            assets/pjr_infinity/fixed/part0331.txt \
            assets/pjr_infinity/fixed/part0332.txt \
            assets/pjr_infinity/fixed/part0333.txt \
            assets/pjr_infinity/parts/part04.txt \
            assets/pjr_infinity/parts/part05.txt \
            assets/pjr_infinity/parts/part06.txt \
            | base64 -d > /tmp/pjr-infinity-assets.zip
          python3 - <<'PY'
          import pathlib, shutil, zipfile
          src = pathlib.Path('/tmp/pjr-infinity-assets')
          with zipfile.ZipFile('/tmp/pjr-infinity-assets.zip') as zf:
              zf.extractall(src)
          approved_non_core = {
              'alphoracle', 'champeon', 'guardeon', 'lepideon', 'obsideon',
              'omeon', 'toxeon', 'sphynxeon', 'jollibird', 'grimfowl',
              'kablowfish', 'sunflorid',
          }
          for species_dir in src.iterdir():
              if not species_dir.is_dir() or species_dir.name not in approved_non_core:
                  continue
              dst = pathlib.Path('graphics/pokemon') / species_dir.name
              dst.mkdir(parents=True, exist_ok=True)
              for name in ('front.png', 'back.png', 'icon.png'):
                  shutil.copy2(species_dir / name, dst / name)
          PY
      - name: Restore locked TRE RELICS donor source
        run: |
          cat \
            assets/pjr_relics/tre_primal/parts/part00.txt \
            assets/pjr_relics/tre_primal/parts/part01.txt \
            assets/pjr_relics/tre_primal/parts/part02a.txt \
            assets/pjr_relics/tre_primal/parts/part02b.txt \
            assets/pjr_relics/tre_primal/parts/part03a.txt \
            assets/pjr_relics/tre_primal/parts/part03b.txt \
            | base64 -d > /tmp/pjr-relics-tre.tar.gz
          echo "73083d435e68ec50b7b3f4fc307ff03842d6e22b36790d70fe04282b8f837dca  /tmp/pjr-relics-tre.tar.gz" | sha256sum -c -
          rm -rf /tmp/pjr-relics-tre
          mkdir -p /tmp/pjr-relics-tre
          tar -xzf /tmp/pjr-relics-tre.tar.gz -C /tmp/pjr-relics-tre
          test -f /tmp/pjr-relics-tre/Front/1037_Ho-oh-P.png
          test -f /tmp/pjr-relics-tre/Front/1038_Lugia-P.png
          test -f /tmp/pjr-relics-tre/Front/1039_Celebi-P.png
      - name: Install locked RELICS sprite sets
        run: |
          rm -rf /tmp/xenoverse-source
          git clone --depth 1 https://gitlab.com/weedleteam/Xenoverse-Source.git /tmp/xenoverse-source
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import shutil

          xeno = Path('/tmp/xenoverse-source')
          tre = Path('/tmp/pjr-relics-tre')

          def rgba(path):
              return Image.open(path).convert('RGBA')

          def exact_palette(images):
              colors=[]
              for im in images:
                  for r,g,b,a in im.getdata():
                      if a < 128:
                          continue
                      rgb=(r,g,b)
                      if rgb not in colors:
                          colors.append(rgb)
              if len(colors)>15:
                  raise RuntimeError(f'Exact donor palette has {len(colors)} opaque colours; GBA limit is 15: {images}')
              return [(0,0,0)] + colors + [(0,0,0)]*(15-len(colors))

          def quantized_palette(images):
              pixels=[]
              for im in images:
                  pixels.extend((r,g,b) for r,g,b,a in im.getdata() if a >= 128)
              strip=Image.new('RGB',(max(1,len(pixels)),1))
              if pixels:
                  strip.putdata(pixels)
              q=strip.quantize(colors=15,method=Image.Quantize.MEDIANCUT)
              raw=q.getpalette()[:45]
              colors=[tuple(raw[i:i+3]) for i in range(0,len(raw),3)]
              while len(colors)<15:
                  colors.append((0,0,0))
              return [(0,0,0)] + colors[:15]

          def index_image(im,palette):
              out=Image.new('P',im.size,0)
              flat=[v for rgb in palette for v in rgb]
              out.putpalette(flat+[0]*(768-len(flat)))
              px=[]
              for r,g,b,a in im.getdata():
                  if a < 128:
                      px.append(0)
                  else:
                      px.append(min(range(1,16),key=lambda i:
                          (r-palette[i][0])**2+(g-palette[i][1])**2+(b-palette[i][2])**2))
              out.putdata(px)
              out.info['transparency']=0
              return out

          def aligned_shiny_palette(normal_pairs, shiny_pairs, indexed_pairs, normal_palette):
              sums=[[0,0,0,0] for _ in range(16)]
              for normal_im, shiny_im, idx_im in zip(normal_pairs, shiny_pairs, indexed_pairs):
                  for idx,(_,_,_,na),(sr,sg,sb,sa) in zip(idx_im.getdata(),normal_im.getdata(),shiny_im.getdata()):
                      if idx and na >= 128 and sa >= 128:
                          sums[idx][0]+=sr; sums[idx][1]+=sg; sums[idx][2]+=sb; sums[idx][3]+=1
              pal=[(0,0,0)]
              for i in range(1,16):
                  if sums[i][3]:
                      n=sums[i][3]
                      pal.append((sums[i][0]//n,sums[i][1]//n,sums[i][2]//n))
                  else:
                      pal.append(normal_palette[i])
              return pal

          def write_pal(path,pal):
              path.write_text('\n'.join(['JASC-PAL','0100','16']+[f'{r} {g} {b}' for r,g,b in pal])+'\n',encoding='ascii')


          def read_icon_palette(index):
              lines=(Path('graphics/pokemon/icon_palettes')/f'pal{index}.pal').read_text(encoding='ascii').splitlines()[3:19]
              return [tuple(map(int,line.split())) for line in lines]

          shared_icon_palettes=[read_icon_palette(i) for i in range(6)]

          def save_standard_set(species, front, back, shiny_front, shiny_back, icon, preserve_exact, icon_pal_index):
              for label,im,size in (
                  ('front',front,(64,64)),('back',back,(64,64)),
                  ('shiny_front',shiny_front,(64,64)),('shiny_back',shiny_back,(64,64))):
                  if im.size != size:
                      raise RuntimeError(f'{species} {label} has unexpected donor size {im.size}')
              palette=(exact_palette if preserve_exact else quantized_palette)([front,back])
              front_i=index_image(front,palette)
              back_i=index_image(back,palette)
              shiny_palette=aligned_shiny_palette(
                  [front,back],[shiny_front,shiny_back],[front_i,back_i],palette)

              anim=Image.new('P',(64,128),0)
              anim.putpalette(front_i.getpalette())
              anim.paste(front_i,(0,0)); anim.paste(front_i,(0,64))
              anim.info['transparency']=0

              if icon.width == 32 and icon.height == 32:
                  doubled=Image.new('RGBA',(32,64),(0,0,0,0))
                  doubled.alpha_composite(icon,(0,0)); doubled.alpha_composite(icon,(0,32))
                  icon=doubled
              elif icon.width == 64 and icon.height == 32:
                  # Donor contains two 32x32 icon frames side-by-side: repack vertically.
                  stacked=Image.new('RGBA',(32,64),(0,0,0,0))
                  stacked.alpha_composite(icon.crop((0,0,32,32)),(0,0))
                  stacked.alpha_composite(icon.crop((32,0,64,32)),(0,32))
                  icon=stacked
              elif icon.size == (128,64):
                  # Xenoverse form icons are two 64x64 animation frames side-by-side.
                  # Convert each frame independently so they are not squashed together.
                  stacked=Image.new('RGBA',(32,64),(0,0,0,0))
                  for frame_no in range(2):
                      frame=icon.crop((64*frame_no,0,64*(frame_no+1),64))
                      bbox=frame.getchannel('A').getbbox()
                      if bbox is None:
                          raise RuntimeError(f'{species} Xenoverse icon frame {frame_no} is empty')
                      frame=frame.crop(bbox)
                      scale=min(30/frame.width,30/frame.height,1.0)
                      if scale < 1:
                          frame=frame.resize(
                              (max(1,round(frame.width*scale)),max(1,round(frame.height*scale))),
                              Image.Resampling.NEAREST)
                      one=Image.new('RGBA',(32,32),(0,0,0,0))
                      one.alpha_composite(frame,((32-frame.width)//2,(32-frame.height)//2))
                      stacked.alpha_composite(one,(0,32*frame_no))
                  icon=stacked
              elif icon.size != (32,64):
                  # Fallback for any other oversized donor icon: convert a single frame.
                  bbox=icon.getchannel('A').getbbox()
                  if bbox is None:
                      raise RuntimeError(f'{species} donor icon is empty')
                  frame=icon.crop(bbox)
                  scale=min(30/frame.width,30/frame.height,1.0)
                  if scale < 1:
                      frame=frame.resize(
                          (max(1,round(frame.width*scale)),max(1,round(frame.height*scale))),
                          Image.Resampling.NEAREST)
                  one=Image.new('RGBA',(32,32),(0,0,0,0))
                  one.alpha_composite(frame,((32-frame.width)//2,(32-frame.height)//2))
                  doubled=Image.new('RGBA',(32,64),(0,0,0,0))
                  doubled.alpha_composite(one,(0,0)); doubled.alpha_composite(one,(0,32))
                  icon=doubled
              icon_i=index_image(icon,shared_icon_palettes[icon_pal_index])

              target=Path('graphics/pokemon')/species
              for name in ('anim_front.png','anim_front_gba.png'):
                  anim.save(target/name,format='PNG',bits=4,optimize=False)
              for name in ('back.png','back_gba.png'):
                  back_i.save(target/name,format='PNG',bits=4,optimize=False)
              for name in ('normal.pal','normal_gba.pal'):
                  write_pal(target/name,palette)
              for name in ('shiny.pal','shiny_gba.pal'):
                  write_pal(target/name,shiny_palette)
              for name in ('icon.png','icon_gba.png'):
                  icon_i.save(target/name,format='PNG',bits=4,optimize=False)

              for name,size in (
                  ('anim_front_gba.png',(64,128)),
                  ('back_gba.png',(64,64)),
                  ('icon_gba.png',(32,64))):
                  check=Image.open(target/name)
                  assert check.mode == 'P', (species,name,check.mode)
                  assert check.size == size, (species,name,check.size)
                  assert len(set(check.getdata())) <= 16, (species,name,len(set(check.getdata())))

          def locate_xeno_battler(form, folder):
              exact=xeno/'Xenoverse'/'Graphics'/'Battlers'/folder/f'{form}.png'
              if exact.exists():
                  return exact
              hits=[p for p in xeno.rglob(f'{form}.png') if p.parent.name.lower()==folder.lower()]
              if not hits:
                  raise RuntimeError(f'Could not find Xenoverse {folder}/{form}.png')
              return sorted(hits)[0]

          def first_xeno_frame(path):
              im=rgba(path)
              bbox=im.getchannel('A').getbbox()
              if bbox is None:
                  raise RuntimeError(f'Empty Xenoverse image: {path}')
              if im.width > im.height*2:
                  cols=[any(im.getpixel((x,y))[3]>=128 for y in range(im.height)) for x in range(im.width)]
                  runs=[]; start=None
                  for x,has in enumerate(cols+[False]):
                      if has and start is None: start=x
                      elif not has and start is not None:
                          runs.append((start,x)); start=None
                  if not runs:
                      im=im.crop(bbox)
                  else:
                      x0,x1=runs[0]
                      im=im.crop((x0,0,x1,im.height))
                      cb=im.getchannel('A').getbbox()
                      if cb: im=im.crop(cb)
              else:
                  im=im.crop(bbox)
              # Xenoverse battlers are ~85-100 px frames, larger than Gen III's
              # 64x64 canvas. Nearest-neighbour reduction destroys facial/outline detail,
              # so use a high-quality pixel-aware downsample before 16-colour indexing.
              scale=min(62/im.width,62/im.height,1.0)
              if scale<1:
                  im=im.resize(
                      (max(1,round(im.width*scale)),max(1,round(im.height*scale))),
                      Image.Resampling.HAMMING)
              canvas=Image.new('RGBA',(64,64),(0,0,0,0))
              canvas.alpha_composite(im,((64-im.width)//2,max(0,63-im.height)))
              return canvas

          def locate_xeno_icon(form):
              hits=[
                  p for p in xeno.rglob(f'{form}.png')
                  if 'icon' in '/'.join(part.lower() for part in p.parts)
                  and 'battler' not in '/'.join(part.lower() for part in p.parts)
              ]
              if not hits:
                  raise RuntimeError(f'No dedicated Xenoverse icon found for locked RELIC form {form}')
              hits=sorted(hits,key=lambda p:(0 if p.parent.name.lower() in ('icon','icons') else 1,len(p.parts),str(p)))
              print(f'Xenoverse icon {form}: {hits[0]}')
              return rgba(hits[0])

          for species,form in {'raikou':'243_2','entei':'244_2','suicune':'245_2'}.items():
              save_standard_set(
                  species,
                  first_xeno_frame(locate_xeno_battler(form,'Front')),
                  first_xeno_frame(locate_xeno_battler(form,'Back')),
                  first_xeno_frame(locate_xeno_battler(form,'FrontShiny')),
                  first_xeno_frame(locate_xeno_battler(form,'BackShiny')),
                  locate_xeno_icon(form),
                  preserve_exact=False,
                  icon_pal_index={'raikou':0,'entei':0,'suicune':0}[species],
              )
              print(f'Installed locked RELIC: {species} <- Xenoverse {form}')

          for species,tre_id,label in (
              ('lugia','1038','Lugia-P'),
              ('celebi','1039','Celebi-P'),
          ):
              save_standard_set(
                  species,
                  rgba(tre/f'Front/{tre_id}_{label}.png'),
                  rgba(tre/f'Back/{tre_id}_{label}.png'),
                  rgba(tre/f'Shiny/Front/{tre_id}_{label}_shiny.png'),
                  rgba(tre/f'Shiny/Back/{tre_id}_{label}_shiny.png'),
                  rgba(tre/f'Icons/{tre_id}_{label}.png'),
                  preserve_exact=True,
                  icon_pal_index={'lugia':0,'celebi':4}[species],
              )
              print(f'Installed locked RELIC: {species} <- TRE {tre_id}_{label}')

          # Relic Ho-Oh is its own species, separate from normal Ho-Oh.
          # TRE provides exact 64x64 RGBA source PNGs; convert only to the
          # indexed PNG storage expected by gbagfx, preserving donor pixels.
          hooh=Path('graphics/pokemon/ho_oh_relic')
          hfront=rgba(tre/'Front/1037_Ho-oh-P.png')
          hback=rgba(tre/'Back/1037_Ho-oh-P.png')
          hshiny_front=rgba(tre/'Shiny/Front/1037_Ho-oh-P_shiny.png')
          hshiny_back=rgba(tre/'Shiny/Back/1037_Ho-oh-P_shiny.png')
          for label,im in (('front',hfront),('back',hback),('shiny_front',hshiny_front),('shiny_back',hshiny_back)):
              if im.size != (64,64):
                  raise RuntimeError(f'Relic Ho-Oh {label} donor size is {im.size}, expected 64x64')

          hpal=exact_palette([hfront,hback])
          hfront_i=index_image(hfront,hpal)
          hback_i=index_image(hback,hpal)
          hshiny_pal=aligned_shiny_palette(
              [hfront,hback],[hshiny_front,hshiny_back],[hfront_i,hback_i],hpal)

          def repalette(indexed,palette):
              out=indexed.copy()
              flat=[v for rgb in palette for v in rgb]
              out.putpalette(flat+[0]*(768-len(flat)))
              out.info['transparency']=0
              return out

          hfront_i.save(hooh/'front.png',format='PNG',bits=4,optimize=False)
          hback_i.save(hooh/'back.png',format='PNG',bits=4,optimize=False)
          repalette(hfront_i,hshiny_pal).save(hooh/'shiny_front.png',format='PNG',bits=4,optimize=False)
          repalette(hback_i,hshiny_pal).save(hooh/'shiny_back.png',format='PNG',bits=4,optimize=False)

          hicon=rgba(tre/'Icons/1037_Ho-oh-P.png')
          if hicon.size == (32,32):
              doubled=Image.new('RGBA',(32,64),(0,0,0,0))
              doubled.alpha_composite(hicon,(0,0)); doubled.alpha_composite(hicon,(0,32))
              hicon=doubled
          if hicon.size != (32,64):
              raise RuntimeError(f'Relic Ho-Oh icon has unsupported donor size {hicon.size}')
          hicon_i=index_image(hicon,shared_icon_palettes[1])
          hicon_i.save(hooh/'icon.png',format='PNG',bits=4,optimize=False)
          print('Installed locked final Relic Ho-Oh <- TRE 1037_Ho-oh-P')

          # I-Unown stays on its existing unown_eye asset set; do not overwrite it.
          # I-Unown and Alphoracle already have their locked icon art, but party/PC
          # icons must be indexed against one of the engine's shared icon palettes.
          # Remap pixels only; do not redraw or replace the source art.
          for folder,pal_index in (('unown_eye',4),('alphoracle',4)):
              ipath=Path('graphics/pokemon')/folder/'icon.png'
              icon_rgba=rgba(ipath)
              if icon_rgba.size != (32,64):
                  raise RuntimeError(f'{folder} icon size is {icon_rgba.size}, expected 32x64')
              index_image(icon_rgba,shared_icon_palettes[pal_index]).save(ipath,format='PNG',bits=4,optimize=False)

          PY
      - name: Verify RELICS species-to-graphics chain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          checks = {
              'data/maps/BurnedTower_B1F_hns/scripts.inc': [
                  'seteventmon SPECIES_RAIKOU, 65',
                  'seteventmon SPECIES_SUICUNE, 69',
              ],
              'data/maps/MtMortar_2F_hns/scripts.inc': [
                  'seteventmon SPECIES_ENTEI, 66',
              ],
              'data/maps/WhirlIslands_LugiaChamber_hns/scripts.inc': [
                  'seteventmon SPECIES_LUGIA, 68',
              ],
              'data/maps/RuinsOfAlph_PuzzleAndRewardChambers_hns/scripts.inc': [
                  'seteventmon SPECIES_UNOWN_I, 65',
              ],
              'data/maps/IlexForest_hns/scripts.inc': [
                  'seteventmon SPECIES_CELEBI, 67',
              ],
              'data/maps/TinTower_RoofDay_hns/scripts.inc': [
                  'seteventmon SPECIES_RELIC_HO_OH, 85',
              ],
          }
          for file,needles in checks.items():
              text=Path(file).read_text()
              for needle in needles:
                  assert needle in text, f'Missing encounter binding: {needle} in {file}'

          gen2=Path('src/data/pokemon/species_info/gen_2_families.h').read_text()
          i0=gen2.index('[SPECIES_UNOWN_I]')
          i1=gen2.index('[SPECIES_UNOWN_J]',i0)
          unown_i=gen2[i0:i1]
          for needle in ('gMonFrontPic_UnownEye','gMonBackPic_UnownEye','gMonPalette_UnownEye','gMonShinyPalette_UnownEye','gMonIcon_UnownEye'):
              assert needle in unown_i, f'I-Unown lost custom Eye graphics: {needle}'

          pjr=Path('src/data/pokemon/species_info/pjr_families.h').read_text()
          h0=pjr.index('[SPECIES_RELIC_HO_OH]')
          relic= pjr[h0:h0+5000]
          for needle in ('gMonFrontPic_HoOhRelic','gMonBackPic_HoOhRelic','gMonPalette_HoOhRelic','gMonShinyPalette_HoOhRelic','gMonIcon_HoOhRelic'):
              assert needle in relic, f'Relic Ho-Oh lost dedicated graphics: {needle}'

          icon_pal_expect={'raikou':0,'entei':0,'lugia':0,'celebi':4,'suicune':0}
          shared_pals={}
          for idx in set(icon_pal_expect.values()) | {1,4}:
              lines=(Path('graphics/pokemon/icon_palettes')/f'pal{idx}.pal').read_text().splitlines()[3:19]
              shared_pals[idx]=[v for line in lines for v in map(int,line.split())]

          for species in ('raikou','entei','lugia','celebi','suicune'):
              root=Path('graphics/pokemon')/species
              expected={'anim_front_gba.png':(64,128),'back_gba.png':(64,64),'icon_gba.png':(32,64)}
              for name,size in expected.items():
                  im=Image.open(root/name)
                  assert im.size==size,(species,name,im.size)
                  assert im.mode=='P',(species,name,im.mode)
                  assert len(set(im.getdata()))<=16,(species,name,len(set(im.getdata())))
              icon=Image.open(root/'icon_gba.png')
              assert icon.getpalette()[:48]==shared_pals[icon_pal_expect[species]], f'{species} icon is not indexed to runtime palette {icon_pal_expect[species]}'
              for name in ('normal_gba.pal','shiny_gba.pal'):
                  assert (root/name).is_file(),(species,name)

          for folder,pal_index in (('unown_eye',4),('alphoracle',4),('ho_oh_relic',1)):
              icon=Image.open(Path('graphics/pokemon')/folder/'icon.png')
              assert icon.size==(32,64),(folder,icon.size)
              assert icon.mode=='P',(folder,icon.mode)
              assert icon.getpalette()[:48]==shared_pals[pal_index], f'{folder} icon is not indexed to runtime palette {pal_index}'

          for root in (Path('graphics/pokemon/unown_eye'),Path('graphics/pokemon/ho_oh_relic')):
              for name in ('front.png','back.png','icon.png','shiny_front.png','shiny_back.png'):
                  assert (root/name).is_file(),f'Missing {root/name}'

          print('RELICS QA PASS: R -> E -> L -> I -> C -> S + final Relic Ho-Oh graphics chain verified.')
          PY
      - name: Build PJR Alpha
        run: |
          make hns -j4 -O
      - name: Package PJR Alpha
        run: |
          cp pokehns.gba PJR-Alpha.gba
          arm-none-eabi-nm -n pokehns.elf > PJR-Alpha.sym
          sha256sum PJR-Alpha.gba > PJR-Alpha-SHA256.txt
          printf "%s\n" "$GITHUB_SHA" > PJR-Alpha-Commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PJR-Alpha
          path: |
            PJR-Alpha.gba
            PJR-Alpha.sym
            PJR-Alpha-SHA256.txt
            PJR-Alpha-Commit.txt
          if-no-files-found: error
          retention-days: 14
