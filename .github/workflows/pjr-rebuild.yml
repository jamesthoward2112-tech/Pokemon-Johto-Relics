name: PJR Alpha build

on:
  push:
    branches: [pjr-rebuild, pjr-rock-shop-ecruteak]
  workflow_dispatch:

permissions:
  contents: write

env:
  UNUSED_ERROR: 0
  DEPRECATED_ERROR: 1

jobs:
  three-starter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Azul Agua donor PNG CRCs
        run: |
          python3 - <<'PY'
          import pathlib, struct, zlib

          paths = [
              pathlib.Path("data/tilesets/primary/azul_agua_building_hns/tiles.png"),
              pathlib.Path("data/tilesets/secondary/azul_agua_rock_shop_hns/tiles.png"),
          ]

          for path in paths:
              data = bytearray(path.read_bytes())
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{path}: not a PNG")
              pos = 8
              while pos < len(data):
                  length = struct.unpack(">I", data[pos:pos + 4])[0]
                  kind = bytes(data[pos + 4:pos + 8])
                  payload_end = pos + 8 + length
                  crc_pos = payload_end
                  if crc_pos + 4 > len(data):
                      raise SystemExit(f"{path}: truncated {kind!r} chunk")
                  crc = zlib.crc32(data[pos + 4:payload_end]) & 0xFFFFFFFF
                  data[crc_pos:crc_pos + 4] = struct.pack(">I", crc)
                  pos = crc_pos + 4
                  if kind == b"IEND":
                      break
              path.write_bytes(data)
              print(f"CRC-normalized {path}")
          PY
      - name: Persist repaired Azul Agua PNGs
        run: |
          if ! git diff --quiet --             data/tilesets/primary/azul_agua_building_hns/tiles.png             data/tilesets/secondary/azul_agua_rock_shop_hns/tiles.png; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add               data/tilesets/primary/azul_agua_building_hns/tiles.png               data/tilesets/secondary/azul_agua_rock_shop_hns/tiles.png
            git commit -m "PJR: normalize Azul Agua donor PNG CRCs"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3
      - name: Install PJR Infinity donor assets
        run: |
          cat \
            assets/pjr_infinity/parts/part00.txt \
            assets/pjr_infinity/parts/part01.txt \
            assets/pjr_infinity/parts/part02.txt \
            assets/pjr_infinity/fixed/part030.txt \
            assets/pjr_infinity/fixed/part031.txt \
            assets/pjr_infinity/fixed/part032.txt \
            assets/pjr_infinity/fixed/part0330.txt \
            assets/pjr_infinity/fixed/part0331.txt \
            assets/pjr_infinity/fixed/part0332.txt \
            assets/pjr_infinity/fixed/part0333.txt \
            assets/pjr_infinity/parts/part04.txt \
            assets/pjr_infinity/parts/part05.txt \
            assets/pjr_infinity/parts/part06.txt \
            | base64 -d > /tmp/pjr-infinity-assets.zip
          python3 - <<'PY'
          import pathlib, shutil, zipfile
          src = pathlib.Path('/tmp/pjr-infinity-assets')
          with zipfile.ZipFile('/tmp/pjr-infinity-assets.zip') as zf:
              zf.extractall(src)
          for species_dir in src.iterdir():
              if not species_dir.is_dir():
                  continue
              dst = pathlib.Path('graphics/pokemon') / species_dir.name
              dst.mkdir(parents=True, exist_ok=True)
              for name in ('front.png', 'back.png', 'icon.png'):
                  # Keep Run44 battle graphics, but use the approved repo icons.
                  if name == 'icon.png' and species_dir.name in ('skarmet', 'mootiny'):
                      continue
                  shutil.copy2(species_dir / name, dst / name)
          PY
      - name: Build PJR Alpha
        run: |
          make hns -j4 -O
      - name: Package PJR Alpha
        run: |
          cp pokehns.gba PJR-Alpha.gba
          arm-none-eabi-nm -n pokehns.elf > PJR-Alpha.sym
          sha256sum PJR-Alpha.gba > PJR-Alpha-SHA256.txt
          printf "%s\n" "$GITHUB_SHA" > PJR-Alpha-Commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PJR-Alpha
          path: |
            PJR-Alpha.gba
            PJR-Alpha.sym
            PJR-Alpha-SHA256.txt
            PJR-Alpha-Commit.txt
          if-no-files-found: error
          retention-days: 14
