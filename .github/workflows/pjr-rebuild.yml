name: PJR Scarabub test

on:
  push:
    branches: [pjr-rebuild]
  workflow_dispatch:

permissions:
  contents: read

env:
  UNUSED_ERROR: 0
  DEPRECATED_ERROR: 1

jobs:
  scarabub-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3
      - name: Build PJR Scarabub test
        run: |
          make hns -j4 -O
      - name: Package Scarabub test
        run: cp pokehns.gba PJR-Scarabub-Test.gba
      - uses: actions/upload-artifact@v4
        with:
          name: PJR-Scarabub-Test
          path: PJR-Scarabub-Test.gba
          if-no-files-found: error
          retention-days: 7
