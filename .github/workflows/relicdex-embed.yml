name: RelicDex - Embed PokéSprite Fork Artwork
on:
  push:
    branches: [relicdex-pages]
    paths:
      - index.html
      - vanilla_map.json
      - tools/embed_pokesprite.py
      - .github/workflows/relicdex-embed.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RelicDex site
        uses: actions/checkout@v4
        with:
          path: website
          persist-credentials: true
      - name: Checkout pinned vanilla sprite fork
        uses: actions/checkout@v4
        with:
          repository: jamesthoward2112-tech/pokesprite
          ref: c5aaa610ff2acdf7fd8e2dccd181bca8be9fcb3e
          path: fork
          persist-credentials: false
      - name: Embed all 381 vanilla sprites directly in HTML
        run: python website/tools/embed_pokesprite.py website/index.html website/vanilla_map.json fork
      - name: Commit complete offline-ready site
        run: |
          cd website
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No sprite changes required'
          else
            git commit -m 'Bundle 381 vanilla sprites from pinned PokéSprite fork'
            git push origin HEAD:relicdex-pages
          fi
