name: PJR rescue build

on:
  push:
    branches: [pjr-rebuild]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rescue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compiler fix and restore workflow
        run: |
          git apply pjr-moves-fix.patch
          git show b448b7ce8:.github/workflows/pjr-rebuild.yml > .github/workflows/pjr-rebuild.yml
          git rm pjr-moves-fix.patch pjr-fix.patch .github/workflows/pjr-rescue.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "PJR: fix move fields and restore CI [skip ci]"
          git push origin HEAD:pjr-rebuild
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3
      - name: Install PJR Infinity donor assets
        run: |
          cat assets/pjr_infinity/parts/part00.txt assets/pjr_infinity/parts/part01.txt assets/pjr_infinity/parts/part02.txt assets/pjr_infinity/fixed/part030.txt assets/pjr_infinity/fixed/part031.txt assets/pjr_infinity/fixed/part032.txt assets/pjr_infinity/fixed/part0330.txt assets/pjr_infinity/fixed/part0331.txt assets/pjr_infinity/fixed/part0332.txt assets/pjr_infinity/fixed/part0333.txt assets/pjr_infinity/parts/part04.txt assets/pjr_infinity/parts/part05.txt assets/pjr_infinity/parts/part06.txt | base64 -d > /tmp/pjr-infinity-assets.zip
          python3 - <<'PY'
          import pathlib, shutil, zipfile
          src = pathlib.Path('/tmp/pjr-infinity-assets')
          with zipfile.ZipFile('/tmp/pjr-infinity-assets.zip') as zf:
              zf.extractall(src)
          for species_dir in src.iterdir():
              if not species_dir.is_dir():
                  continue
              dst = pathlib.Path('graphics/pokemon') / species_dir.name
              dst.mkdir(parents=True, exist_ok=True)
              for name in ('front.png', 'back.png', 'icon.png'):
                  if name == 'icon.png' and species_dir.name in ('skarmet', 'mootiny'):
                      continue
                  shutil.copy2(species_dir / name, dst / name)
          PY
      - name: Build ROM
        run: make hns -j4 -O
      - name: Package ROM
        run: |
          cp pokehns.gba PJR-Run${{ github.run_number }}-Focused-Fixes.gba
          arm-none-eabi-nm -n pokehns.elf > PJR-Run${{ github.run_number }}-Focused-Fixes.sym
      - uses: actions/upload-artifact@v4
        with:
          name: PJR-Run${{ github.run_number }}-Focused-Fixes
          path: |
            PJR-Run${{ github.run_number }}-Focused-Fixes.gba
            PJR-Run${{ github.run_number }}-Focused-Fixes.sym
          retention-days: 7
