name: PJR source repair

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore pinned files and apply Alpha 1 patch
        run: |
          files="data/maps/NewBarkTown_Lab_hns/scripts.inc include/config/dexnav.h include/config/general.h include/constants/flags.h include/constants/flags_hns.h include/constants/items.h include/constants/species.h include/constants/vars.h include/constants/vars_hns.h src/battle_gfx_sfx_util.c src/data/graphics/pokemon.h src/data/items.h src/data/pokemon/level_up_learnsets/gen_3.h src/data/pokemon/level_up_learnsets_gen3.c src/data/pokemon/species_info.h src/data/pokemon/species_info/pjr_families.h src/title_screen.c"
          existing="data/maps/NewBarkTown_Lab_hns/scripts.inc include/config/dexnav.h include/config/general.h include/constants/flags.h include/constants/flags_hns.h include/constants/items.h include/constants/species.h include/constants/vars.h include/constants/vars_hns.h src/battle_gfx_sfx_util.c src/data/graphics/pokemon.h src/data/items.h src/data/pokemon/level_up_learnsets/gen_3.h src/data/pokemon/level_up_learnsets_gen3.c src/data/pokemon/species_info.h src/title_screen.c"
          git checkout 167aa6d537b109bb229c231ddce4616974c4da71 -- $existing
          rm -f src/data/pokemon/species_info/pjr_families.h
          git apply .github/pjr-alpha1-source.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Repair Alpha 1 source payload"
          git push
