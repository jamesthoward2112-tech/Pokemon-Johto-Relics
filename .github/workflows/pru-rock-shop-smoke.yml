name: PRU Fresh Start Rock Shop QA ROM

on:
  push:
    branches: [pru/rock-shop-freshstart-20261016]
  workflow_dispatch:

permissions:
  contents: read

env:
  UNUSED_ERROR: 0
  DEPRECATED_ERROR: 1

jobs:
  pru-donor-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert Rock Shop badge tiers, item IDs, and NPC placement
        run: python3 tools/pru/check_rock_shop.py
      - name: Check quick-start QA controls are isolated and ready
        run: |
          python3 - <<'PY'
          from pathlib import Path
          c = Path('src/new_game.c').read_text()
          script = Path('data/maps/GoldenrodCity_DepartmentStore_2F_hns/scripts.inc').read_text()
          layout = Path('data/maps/GoldenrodCity_DepartmentStore_2F_hns/map.json').read_text()
          assert 'MAP_GOLDENROD_CITY_DEPARTMENT_STORE_2F_HNS' in c
          assert 'IS_HNS ? 950000 : 3000' in c
          assert 'SPECIES_EEVEE' in c and 'SPECIES_CLAMPERL' in c
          for flag in ('FLAG_BADGE04_GET', 'FLAG_BADGE08_GET'):
              assert flag in script
          assert 'GoldenrodDeptStore2_EventScript_QATierControl' in layout
          print('PASS: fresh start -> Goldenrod with funds and party; 0/4/8 badge cycling')
          PY
      - name: Inventory all registered HNS dialogue and gift/flag events
        run: python3 tools/audit_pru_standalone_dialogue.py
      - name: Upload standalone PRU dialogue inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PRU-Dialogue-Audit
          path: artifacts/pru-dialogue-audit/
          if-no-files-found: warn
          retention-days: 30
      - name: Audit gift-independent wild access
        run: python3 tools/audit_pru_catchability.py
      - name: Upload wild catchability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PRU-Catchability-Audit
          path: artifacts/pru-catchability/
          if-no-files-found: warn
          retention-days: 30
      - name: Download Sevii Noibat original Radical Red sprite sources
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request, struct, hashlib, json
          commit = "488a0918194d567b5f7b02c396118d51fb9c81ce"
          root = pathlib.Path("artifacts/pru-sevii-donor")
          summary = []
          for species, rr_id in (("noibat",866),("noivern",867)):
              for part in ("front","back","front shiny","back shiny"):
                  dest = root / species / (part.replace(" ","_") + ".png")
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  url = ("https://raw.githubusercontent.com/JwowSquared/"
                         "Radical-Red-Pokedex/" + commit + "/graphics/species/"
                         + part.replace(" ","%20") + "/" + str(rr_id) + ".png")
                  with urllib.request.urlopen(url,timeout=20) as response:
                      raw = response.read()
                  assert raw[:4] == bytes((137, 80, 78, 71)), url
                  dest.write_bytes(raw)
                  width, height = struct.unpack(">II",raw[16:24])
                  summary.append(dict(pokemon=species,part=part,width=width,
                                      height=height,sha256=hashlib.sha256(raw).hexdigest()))
          (root/"manifest.json").write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - name: Upload source Sevii sprites for PRU integration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PRU-Sevii-Source-Sprites
          path: artifacts/pru-sevii-donor/
          if-no-files-found: warn
          retention-days: 30
      - name: Install pinned Sevii battle sprites (Radical Red)
        run: python3 tools/import_pru_sevii_sprites.py
      - name: Verify PRU regional replacement species, encounters and parties
        run: python3 tools/check_pru_regional_replacements.py
      - name: Restore exact Azul Agua donor tiles
        run: |
          base64 -d assets/pjr_azul_agua/building_tiles.png.b64 > data/tilesets/primary/azul_agua_building_hns/tiles.png
          base64 -d assets/pjr_azul_agua/rock_shop_tiles.png.b64 > data/tilesets/secondary/azul_agua_rock_shop_hns/tiles.png
          echo "19d1988dc7426e0be5957918de876e7a500ae327cc99bf53ef55d172d6a0f240  data/tilesets/primary/azul_agua_building_hns/tiles.png" | sha256sum -c -
          echo "5dac0833356b45617e3321e3686a15460a4f88d3f631cd1697071802f21bcc6a  data/tilesets/secondary/azul_agua_rock_shop_hns/tiles.png" | sha256sum -c -
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3
      - name: Install PJR Infinity donor assets
        run: |
          cat \
            assets/pjr_infinity/parts/part00.txt \
            assets/pjr_infinity/parts/part01.txt \
            assets/pjr_infinity/parts/part02.txt \
            assets/pjr_infinity/fixed/part030.txt \
            assets/pjr_infinity/fixed/part031.txt \
            assets/pjr_infinity/fixed/part032.txt \
            assets/pjr_infinity/fixed/part0330.txt \
            assets/pjr_infinity/fixed/part0331.txt \
            assets/pjr_infinity/fixed/part0332.txt \
            assets/pjr_infinity/fixed/part0333.txt \
            assets/pjr_infinity/parts/part04.txt \
            assets/pjr_infinity/parts/part05.txt \
            assets/pjr_infinity/parts/part06.txt \
            | base64 -d > /tmp/pjr-infinity-assets.zip
          python3 - <<'PY'
          import pathlib, shutil, zipfile
          src = pathlib.Path('/tmp/pjr-infinity-assets')
          with zipfile.ZipFile('/tmp/pjr-infinity-assets.zip') as zf:
              zf.extractall(src)
          approved_non_core = {
              'alphoracle', 'champeon', 'guardeon', 'lepideon', 'obsideon',
              'omeon', 'toxeon', 'sphynxeon', 'jollibird', 'grimfowl',
              'kablowfish', 'sunflorid',
          }
          for species_dir in src.iterdir():
              if not species_dir.is_dir() or species_dir.name not in approved_non_core:
                  continue
              dst = pathlib.Path('graphics/pokemon') / species_dir.name
              dst.mkdir(parents=True, exist_ok=True)
              # Party icons in the repo are palette-normalized GBA conversions of the donor icons.
              # Keep those conversions; copying the donor PNGs here corrupts party-menu rendering.
              for name in ('front.png', 'back.png'):
                  shutil.copy2(species_dir / name, dst / name)
          PY
      - name: Check Tin Tower shortcut and final encounter
        run: python3 tools/check_pjr_tintower_shortcut.py
      - name: Build PRU donor test ROM
        run: |
          make hns -j4 -O
      - name: Package PRU standalone development ROM
        run: |
          cp pokehns.gba PRU-RockShop-FreshStart.gba
          arm-none-eabi-nm -n pokehns.elf > PRU-RockShop-FreshStart.sym
          sha256sum PRU-RockShop-FreshStart.gba > PRU-RockShop-FreshStart-SHA256.txt
          printf "%s\n" "$GITHUB_SHA" > PRU-RockShop-FreshStart-Commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PRU-RockShop-FreshStart
          path: |
            PRU-RockShop-FreshStart.gba
            PRU-RockShop-FreshStart.sym
            PRU-RockShop-FreshStart-SHA256.txt
            PRU-RockShop-FreshStart-Commit.txt
          if-no-files-found: error
          retention-days: 14
