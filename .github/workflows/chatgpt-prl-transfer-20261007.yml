name: ChatGPT PRL ROM transfer
on:
  push:
    paths:
      - '.github/workflows/chatgpt-prl-transfer-20261007.yml'

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary ROM branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-transfer-prl-20261007
      - name: Verify ROM
        shell: bash
        run: |
          set -euo pipefail
          test -f PRL_FIRERED_KANTO_TEST_2026-10-07.gba
          echo 'ac29900bcb675b69b9c6668eef0e79edac6181f9b111072ffb6830acd6c9f816  PRL_FIRERED_KANTO_TEST_2026-10-07.gba' | sha256sum -c -
      - name: Upload ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: PRL_FIRERED_KANTO_TEST_2026-10-07
          path: PRL_FIRERED_KANTO_TEST_2026-10-07.gba
          if-no-files-found: error
          retention-days: 1
