name: PRU consolidated integration build

on:
  push:
    branches: [pru/complete-selective-integration-20261016, pru/pretest-story-services-20261016, pru/noxichu-last-wish-title-test-20261017]
    paths:
      - docs/PRU_CI_TRIGGER.md
      - tools/pru/build_noxichu_intro_trial.py
      - tools/pru/fit_chansey_portrait.py
      - tools/pru/verify_compiled_rom.py
      - assets/pru_title/**
      - .github/workflows/pru-battle-port.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  UNUSED_ERROR: 0
  DEPRECATED_ERROR: 1

jobs:
  three-starter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify PRU first-adventure fossil/Pikachu and Relic dialogue
        if: github.ref_name == 'pru/pretest-story-services-20261016' || github.ref_name == 'pru/noxichu-last-wish-title-test-20261017'
        run: python3 tools/pru/check_pretest_story.py
      - name: Upload PRU dialogue scan report
        if: github.ref_name == 'pru/pretest-story-services-20261016' || github.ref_name == 'pru/noxichu-last-wish-title-test-20261017'
        uses: actions/upload-artifact@v4
        with:
          name: PRU-Pretest-Story-Scan
          path: PRU-Pretest-Story-Scan.md
          if-no-files-found: error
      - name: Verify repeatable PRU Chansey training doubles
        if: github.ref_name == 'pru/noxichu-last-wish-title-test-20261017'
        run: python3 tools/pru/check_chansey_training.py
      - name: Add low-level Poochyena to Route 30 wild grass
        if: github.ref_name == 'pru/noxichu-last-wish-title-test-20261017'
        run: python3 tools/pru/add_route30_poochyena.py
      - name: Verify PRU rare optional gift replacements
        if: github.ref_name == 'pru/noxichu-last-wish-title-test-20261017'
        run: python3 tools/pru/check_rare_gifts.py
      - name: Verify PRL signature move integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          enum = Path('include/constants/moves.h').read_text()
          info = Path('src/data/moves_info.h').read_text()
          source = Path('tools/pru/donors/prl_custom_move_records.reference.h').read_text()
          names = ('AMBER_BLADE','SUN_RITE','TECTONIC_TIDE','EPOCH_CRASH','RELIC_WISH',
                   'EDEN_BLOOM','SCORCHWING','BASTION_CANNON','EERIE_FOG')
          for suffix in names:
              name = 'MOVE_' + suffix
              assert ('    ' + name + ',') in enum or (name + ' =') in enum
              assert ('[' + name + ']') in info
              assert ('[' + name + ']') in source
          assert '.weatherType = BATTLE_WEATHER_FOG' in info
          print('PASS: 9 PRL signature move records present in the active engine tables')
          PY
      - name: Verify native PRL ability integration
        run: python3 tools/pru/verify_custom_abilities.py
      - name: Check authentic PRU move references before costly compilation
        run: python3 tools/pru/check_custom_move_registration.py
      - name: Verify 25 donor moves and PRL signature effect parity in source
        run: python3 tools/pru/verify_25_donor_moves.py
      - name: Restore exact Azul Agua donor tiles
        run: |
          base64 -d assets/pjr_azul_agua/building_tiles.png.b64 > data/tilesets/primary/azul_agua_building_hns/tiles.png
          base64 -d assets/pjr_azul_agua/rock_shop_tiles.png.b64 > data/tilesets/secondary/azul_agua_rock_shop_hns/tiles.png
          echo "19d1988dc7426e0be5957918de876e7a500ae327cc99bf53ef55d172d6a0f240  data/tilesets/primary/azul_agua_building_hns/tiles.png" | sha256sum -c -
          echo "5dac0833356b45617e3321e3686a15460a4f88d3f631cd1697071802f21bcc6a  data/tilesets/secondary/azul_agua_rock_shop_hns/tiles.png" | sha256sum -c -
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3 python3-pil
      - name: Install PJR Infinity donor assets
        run: |
          cat \
            assets/pjr_infinity/parts/part00.txt \
            assets/pjr_infinity/parts/part01.txt \
            assets/pjr_infinity/parts/part02.txt \
            assets/pjr_infinity/fixed/part030.txt \
            assets/pjr_infinity/fixed/part031.txt \
            assets/pjr_infinity/fixed/part032.txt \
            assets/pjr_infinity/fixed/part0330.txt \
            assets/pjr_infinity/fixed/part0331.txt \
            assets/pjr_infinity/fixed/part0332.txt \
            assets/pjr_infinity/fixed/part0333.txt \
            assets/pjr_infinity/parts/part04.txt \
            assets/pjr_infinity/parts/part05.txt \
            assets/pjr_infinity/parts/part06.txt \
            | base64 -d > /tmp/pjr-infinity-assets.zip
          python3 - <<'PY'
          import pathlib, shutil, zipfile
          src = pathlib.Path('/tmp/pjr-infinity-assets')
          with zipfile.ZipFile('/tmp/pjr-infinity-assets.zip') as zf:
              zf.extractall(src)
          approved_non_core = {
              'alphoracle', 'champeon', 'guardeon', 'lepideon', 'obsideon',
              'omeon', 'toxeon', 'sphynxeon', 'jollibird', 'grimfowl',
              'kablowfish', 'sunflorid',
          }
          for species_dir in src.iterdir():
              if not species_dir.is_dir() or species_dir.name not in approved_non_core:
                  continue
              dst = pathlib.Path('graphics/pokemon') / species_dir.name
              dst.mkdir(parents=True, exist_ok=True)
              # Party icons in the repo are palette-normalized GBA conversions of the donor icons.
              # Keep those conversions; copying the donor PNGs here corrupts party-menu rendering.
              for name in ('front.png', 'back.png'):
                  shutil.copy2(species_dir / name, dst / name)
          PY
      - name: Check Tin Tower shortcut and final encounter
        run: python3 tools/check_pjr_tintower_shortcut.py
      - name: Convert approved RGBA donor sprites to indexed GBA art
        run: python3 tools/pru/prepare_external_donor_art.py
      - name: Assemble original Hoenn's Last Wish and approved Noxichu title
        if: github.ref_name == 'pru/noxichu-last-wish-title-test-20261017'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/pru/build_noxichu_intro_trial.py
      - name: Restore approved 64x64 twin Chansey GBA trainer portrait
        if: github.ref_name == 'pru/noxichu-last-wish-title-test-20261017'
        run: |
          base64 -d assets/pru_chansey/twins_front_64.png.b64 > graphics/trainers/front_pics/pru_chansey_twins.png
          echo "55452b964a24dc7cd5098f90ca2bba69325c1c8a9d381ddb4a5824e0e681267b  graphics/trainers/front_pics/pru_chansey_twins.png" | sha256sum -c -
          python3 - <<'PY'
          from PIL import Image
          img = Image.open('graphics/trainers/front_pics/pru_chansey_twins.png')
          assert img.size == (64,64) and img.mode == 'P'
          assert len(img.getcolors()) <= 16
          print('PRU_CHANSEY_ASSET_PASS: indexed 64x64 <=16 colours')
          PY
          python3 tools/pru/fit_chansey_portrait.py
      - name: Build PRU consolidated integration
        run: |
          if make hns -j2 -O > /tmp/pru-build.log 2>&1; then
            echo "ROM compilation completed successfully."
          else
            echo "First compiler/linker errors:"
            grep -n -m 70 -E 'error:|Error:|undefined reference|make: \*\*\*' /tmp/pru-build.log || true
            echo "Build log tail:"
            tail -n 55 /tmp/pru-build.log
            exit 1
          fi
      - name: Audit actual compiled PRU binary and mark distinct test header
        run: |
          arm-none-eabi-nm -n pokehns.elf > PRU-QA-symbols.sym
          python3 tools/pru/verify_compiled_rom.py
      - name: Boot the compiled ROM in mGBA and capture gameplay evidence
        if: github.ref_name == 'pru/noxichu-last-wish-title-test-20261017'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb mgba-sdl ffmpeg
          mkdir -p PRU-QA
          Xvfb :99 -screen 0 1024x768x24 -nolisten tcp > PRU-QA/xvfb.log 2>&1 &
          export DISPLAY=:99 SDL_VIDEODRIVER=x11 SDL_AUDIODRIVER=dummy
          sleep 2
          mgba -3 pokehns.gba > PRU-QA/mgba.log 2>&1 &
          EMU_PID=$!
          sleep 6
          kill -0 "$EMU_PID" || (cat PRU-QA/mgba.log; exit 1)
          ffmpeg -hide_banner -loglevel error -f x11grab -video_size 1024x768 -framerate 1 -i :99.0 -t 90 -c:v libx264 -preset ultrafast -pix_fmt yuv420p PRU-QA/boot-evidence.mp4
          kill "$EMU_PID" || true
      - uses: actions/upload-artifact@v4
        if: always() && github.ref_name == 'pru/noxichu-last-wish-title-test-20261017'
        with:
          name: PRU-MGBA-BOOT-EVIDENCE
          path: PRU-QA/
          if-no-files-found: warn
          retention-days: 14
      - name: Package PRU ROM for testing
        run: |
          cp pokehns.gba PRU-Consolidated-WIP.gba
          arm-none-eabi-nm -n pokehns.elf > PRU-Consolidated-WIP.sym
          sha256sum PRU-Consolidated-WIP.gba > PRU-Consolidated-WIP-SHA256.txt
          printf "%s\n" "$GITHUB_SHA" > PRU-Consolidated-WIP-Commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PRU-Consolidated-WIP
          path: |
            PRU-Consolidated-WIP.gba
            PRU-Consolidated-WIP.sym
            PRU-Consolidated-WIP-SHA256.txt
            PRU-Consolidated-WIP-Commit.txt
          if-no-files-found: error
          retention-days: 14

      - name: Package approved Noxichu + Last Wish title test
        if: github.ref_name == 'pru/noxichu-last-wish-title-test-20261017'
        run: |
          cp pokehns.gba PRU-Noxichu-LastWish-TEST.gba
          sha256sum PRU-Noxichu-LastWish-TEST.gba > PRU-Noxichu-LastWish-TEST.sha256
      - uses: actions/upload-artifact@v4
        if: github.ref_name == 'pru/noxichu-last-wish-title-test-20261017'
        with:
          name: PRU-Noxichu-LastWish-TEST
          path: |
            PRU-Noxichu-LastWish-TEST.gba
            PRU-Noxichu-LastWish-TEST.sha256
          if-no-files-found: error
          retention-days: 14
