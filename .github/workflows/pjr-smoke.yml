name: PJR Alpha 1 title smoke

on:
  push:
    paths: [.github/workflows/pjr-smoke.yml]

permissions:
  contents: read
  actions: read

jobs:
  title-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pokemon-Johto-Relics-Alpha1
          run-id: 36260818362
          github-token: ${{ github.token }}
          repository: jamesthoward2112-tech/Pokemon-Johto-Relics
      - name: Install emulator and display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mgba-sdl xvfb xdotool imagemagick
      - name: Capture title and Start response
        run: |
          test -s Pokemon-Johto-Relics-Alpha1.gba
          timeout 80s xvfb-run -a -s '-screen 0 800x600x24' bash -euxc '
            emulator=$(command -v mgba || find /usr/games -name mgba -type f -print -quit)
            SDL_VIDEODRIVER=x11 SDL_RENDER_DRIVER=software SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 "$emulator" Pokemon-Johto-Relics-Alpha1.gba > emulator.log 2>&1 &
            pid=$!
            sleep 8
            win=$(xdotool search --name mGBA | head -n 1)
            xdotool getwindowname "$win"
            timeout 8s import -window "$win" title_a.png
            sleep 1
            timeout 8s import -window "$win" title_b.png
            xdotool key --window "$win" Return
            sleep 4
            timeout 8s import -window "$win" after_start.png
            kill -9 "$pid" || true
          '
          ls -lh title_a.png title_b.png after_start.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PJR-Alpha1-title-smoke
          path: |
            title_a.png
            title_b.png
            after_start.png
            emulator.log
          if-no-files-found: error
