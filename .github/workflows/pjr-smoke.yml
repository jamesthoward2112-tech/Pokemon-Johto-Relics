name: PJR Alpha 1 opening smoke

on:
  push:
    paths: [.github/workflows/pjr-smoke.yml]

permissions:
  contents: read
  actions: read

jobs:
  opening-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pokemon-Johto-Relics-Alpha1
          run-id: 36262174583
          github-token: ${{ github.token }}
          repository: jamesthoward2112-tech/Pokemon-Johto-Relics
      - name: Install emulator and display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mgba-sdl xvfb xdotool imagemagick
      - name: Keep emulator focused through name confirmation
        run: |
          test -s Pokemon-Johto-Relics-Alpha1.gba
          timeout 150s xvfb-run -a -s '-screen 0 800x600x24' bash -euxc '
            emulator=$(command -v mgba || find /usr/games -name mgba -type f -print -quit)
            SDL_VIDEODRIVER=x11 SDL_RENDER_DRIVER=software SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 "$emulator" Pokemon-Johto-Relics-Alpha1.gba > emulator.log 2>&1 &
            pid=$!
            sleep 26
            win=$(xdotool search --name mGBA | head -n 1)

            press() {
              xdotool windowfocus --sync "$win"
              xdotool keydown "$1"
              sleep 0.2
              xdotool keyup "$1"
            }

            shot() {
              xdotool windowfocus --sync "$win"
              sleep 0.5
              timeout 8s import -window "$win" "$1"
              xdotool windowfocus --sync "$win"
            }

            press Return
            sleep 3
            press x
            sleep 7
            for i in $(seq 1 14); do
              press x
              sleep 1.5
            done
            shot name_a.png

            press Return
            sleep 1
            press x
            sleep 2
            shot name_confirm.png

            press x
            for i in $(seq -w 1 10); do
              sleep 1.5
              shot "post_confirm_$i.png"
            done

            kill -9 "$pid" || true
          '
          ls -lh name_a.png name_confirm.png post_confirm_*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PJR-Alpha1-opening-smoke
          path: |
            name_a.png
            name_confirm.png
            post_confirm_*.png
            emulator.log
          if-no-files-found: error
