name: PJR Alpha 1 opening smoke

on:
  push:
    paths: [.github/workflows/pjr-smoke.yml]

permissions:
  contents: read
  actions: read

jobs:
  opening-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pokemon-Johto-Relics-Alpha1
          run-id: 36264740891
          github-token: ${{ github.token }}
          repository: jamesthoward2112-tech/Pokemon-Johto-Relics
      - name: Install emulator and display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mgba-sdl xvfb xdotool imagemagick
      - name: Test name confirmation without mid-transition capture
        run: |
          test -s Pokemon-Johto-Relics-Alpha1.gba
          timeout 145s xvfb-run -a -s '-screen 0 800x600x24' bash -euxc '
            emulator=$(command -v mgba || find /usr/games -name mgba -type f -print -quit)
            SDL_VIDEODRIVER=x11 SDL_RENDER_DRIVER=software SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 "$emulator" Pokemon-Johto-Relics-Alpha1.gba > emulator.log 2>&1 &
            pid=$!
            sleep 26
            win=$(xdotool search --name mGBA | head -n 1)
            press() {
              xdotool windowfocus --sync "$win"
              xdotool keydown "$1"
              sleep 0.2
              xdotool keyup "$1"
            }

            press Return
            sleep 3
            press x
            sleep 7
            for i in $(seq 1 14); do
              press x
              sleep 1.5
            done

            # Naming screen: keep default single-letter A and accept it.
            press Return
            sleep 1
            press x
            sleep 2
            press x

            # Give the post-name transition time to complete before any capture.
            sleep 12
            xdotool windowfocus --sync "$win"
            timeout 8s import -window "$win" after_confirm_12s.png

            # Continue through any remaining intro text without capturing between presses.
            xdotool windowfocus --sync "$win"
            for i in $(seq 1 10); do
              press x
              sleep 1.2
            done
            sleep 5
            xdotool windowfocus --sync "$win"
            timeout 8s import -window "$win" after_continue.png

            kill -9 "$pid" || true
          '
          ls -lh after_confirm_12s.png after_continue.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PJR-Alpha1-opening-smoke
          path: |
            after_confirm_12s.png
            after_continue.png
            emulator.log
          if-no-files-found: error
