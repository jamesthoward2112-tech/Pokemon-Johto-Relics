name: PJR Alpha 1 CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  UNUSED_ERROR: 0
  DEPRECATED_ERROR: 1

jobs:
  build-hns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3
      - name: Build Pokémon Johto Relics
        run: |
          if ! make hns -j4 -O > build.log 2>&1; then
            rg -n -C 3 'error:|Error [0-9]|undefined reference|libpng error|Failed to|Traceback|^make:' build.log | tail -n 160 || tail -n 160 build.log
            exit 1
          fi
      - name: Package Alpha 1 ROM
        run: cp pokehns.gba Pokemon-Johto-Relics-Alpha1.gba
      - name: Upload Alpha 1 ROM
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Johto-Relics-Alpha1
          path: Pokemon-Johto-Relics-Alpha1.gba
          if-no-files-found: error
