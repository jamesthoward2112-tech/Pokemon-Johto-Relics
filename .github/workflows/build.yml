name: PJR Alpha 1 CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  UNUSED_ERROR: 0
  DEPRECATED_ERROR: 1

jobs:
  build-hns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3
      - name: Build Pokémon Johto Relics
        run: |
          if ! make hns -j4 -O > build.log 2>&1; then
            grep -nE -C 3 'error:|Error [0-9]|undefined reference|libpng error|Failed to|Traceback|make:' build.log | tail -n 120 || true
            tail -n 80 build.log
            exit 1
          fi
      - name: Package Alpha 1 ROM
        run: cp pokehns.gba Pokemon-Johto-Relics-Alpha1.gba
      - name: Upload Alpha 1 ROM
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Johto-Relics-Alpha1
          path: Pokemon-Johto-Relics-Alpha1.gba
          if-no-files-found: error
          retention-days: 14

  opening-smoke:
    needs: build-hns
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pokemon-Johto-Relics-Alpha1
      - name: Install emulator and display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mgba-sdl xvfb xdotool imagemagick
      - name: Verify opening through trainer-name handoff
        run: |
          test -s Pokemon-Johto-Relics-Alpha1.gba
          timeout 145s xvfb-run -a -s '-screen 0 800x600x24' bash -euxc '
            emulator=$(command -v mgba || find /usr/games -name mgba -type f -print -quit)
            SDL_VIDEODRIVER=x11 SDL_RENDER_DRIVER=software SDL_AUDIODRIVER=dummy LIBGL_ALWAYS_SOFTWARE=1 "$emulator" Pokemon-Johto-Relics-Alpha1.gba > emulator.log 2>&1 &
            pid=$!
            sleep 26
            win=$(xdotool search --name mGBA | head -n 1)
            press() {
              xdotool windowfocus --sync "$win"
              xdotool keydown "$1"
              sleep 0.2
              xdotool keyup "$1"
            }

            press Return
            sleep 3
            press x
            sleep 7
            for i in $(seq 1 14); do
              press x
              sleep 1.5
            done

            press Return
            sleep 1
            press x
            sleep 2
            press x

            sleep 12
            xdotool windowfocus --sync "$win"
            timeout 8s import -window "$win" after_confirm_12s.png

            for i in $(seq 1 10); do
              press x
              sleep 1.2
            done
            sleep 5
            xdotool windowfocus --sync "$win"
            timeout 8s import -window "$win" after_continue.png

            kill -9 "$pid" || true
          '
          ls -lh after_confirm_12s.png after_continue.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PJR-Alpha1-opening-smoke
          path: |
            after_confirm_12s.png
            after_continue.png
            emulator.log
          if-no-files-found: error
          retention-days: 7
